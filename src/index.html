<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF1EC">
<script>
  // Apply a saved light/dark choice before first paint. With none saved, CSS follows the system.
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  }());
</script>
<title>2028 Watch</title>
<meta name="description" content="Where the 2028 presidential candidates stand on the issues, where media pundits stand on the candidates, and what changed since the last update.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23EEF1EC'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='8' fill='%2316233A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="wordmark" href="#/">2028 Watch</a>
    <nav class="nav" aria-label="Sections">
      <a href="#/" data-nav="overview">Overview</a>
      <a href="#/candidates" data-nav="candidates">Candidates</a>
      <a href="#/pundits" data-nav="pundits">Pundits</a>
      <a href="#/polls" data-nav="polls">Polls</a>
      <a href="#/states" data-nav="states">States</a>
    </nav>
    <p class="status-line"><span id="countdown"></span><span id="updated"></span></p>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">Dark mode</button>
  </div>
</header>
<main id="main" tabindex="-1">
  <p class="loading">Loading the tracker.</p>
</main>
<footer class="footer" id="footer"></footer>
<dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
  <div class="drawer-head">
    <button type="button" class="drawer-close" id="drawer-close">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</dialog>
<!--TRACKER_DATA-->
<script src="app.js"></script>
</body>
</html>
